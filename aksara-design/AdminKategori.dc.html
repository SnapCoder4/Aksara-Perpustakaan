<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Aksara Admin: Manajemen Kategori</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>.t{--page:#F6F2E9;--paper:#F6F2E9;--card:#FFFFFF;--soft:#E6ECF5;--bd:#E2DDD0;--bd2:#C3CBDB;--ink:#0B1733;--ink2:#1E2B4A;--mut:#4A5873;--strong:#10264A;--pri:#10264A;--onpri:#FBF8F2;--link:#183E70;--gold:#8A5A0B;--ok:#0A6B3B;--warn:#8A3B12;--err:#8F2A22;--errtx:#5A3A37;--dz:#EEF2F9;--dzi:#DCE5F3;--dzb:#9FB2D0;--errbg:#FCF1EF;--erri:#F6DAD6;--errbd:#D69A93;}.t[data-theme=dark]{--page:#0B1733;--paper:#0B1733;--card:#10264A;--soft:#16305A;--bd:#1E3760;--bd2:#3A5686;--ink:#F4F1EA;--ink2:#DCE4F2;--mut:#A9B7D0;--strong:#F4F1EA;--pri:#D9B66F;--onpri:#0B1733;--link:#F2D49A;--gold:#E0B35A;--ok:#6EE0A8;--warn:#F2A06B;--err:#FF9C92;--errtx:#E8C4C0;--dz:#0F2147;--dzi:#1B3A6B;--dzb:#3A5686;--errbg:#2A1513;--erri:#4A2420;--errbd:#7A3A34;}
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:var(--link);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.md{animation:pop .25s ease both}
@media (prefers-reduced-motion:reduce){.md{animation:none}}
</style>
</helmet>
<div class="t" data-theme="{{theme}}" style="position:relative;overflow:hidden;width:100%;display:flex;flex-wrap:wrap;min-height:900px;background:var(--page);color:var(--ink)">
<aside aria-label="Menu admin" style="flex:0 0 250px;box-sizing:border-box;background:#10264A;color:#EAF2F0;padding:22px 14px">
<div style="display:flex;align-items:center;gap:10px;padding:4px 8px 18px"><span style="width:36px;height:36px;border-radius:10px;background:#FBF8F2;color:#10264A;display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-size:21px">A</span><span style="font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:600">Admin</span></div>
<nav style="display:flex;flex-direction:column;gap:2px">
<sc-for list="{{menu}}" as="m" hint-placeholder-count="12">
<sc-if value="{{m.isHead}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#93A5C6;padding:16px 12px 6px;font-weight:600">{{m.label}}</span></sc-if>
<sc-if value="{{m.isLink}}" hint-placeholder-val="{{ true }}"><a href="{{m.href}}" style="{{m.style}}">{{m.label}}<sc-if value="{{m.badge}}" hint-placeholder-val="{{ false }}"><span style="margin-left:auto;min-width:22px;height:22px;border-radius:99px;background:#D9B66F;color:#2A1C03;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">{{m.badge}}</span></sc-if></a></sc-if>
</sc-for>
</nav>
</aside>
<main style="flex:999 1 640px;min-width:0;padding:28px 32px 56px;display:flex;flex-direction:column;gap:22px">
<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px"><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:14px;color:var(--mut)">Katalog</span><h1 style="margin:0;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:34px;letter-spacing:-.01em">Manajemen kategori</h1></div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button type="button" onClick="{{toggleTheme}}" style="padding:10px 16px;border:1px solid var(--bd2);border-radius:999px;background:transparent;color:var(--ink);font-size:14px;font-weight:500;min-height:44px">{{themeLabel}}</button></div></div>
<div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
<section aria-label="Daftar kategori" style="flex:2 1 460px;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:14px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6"><div style="background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:24px;box-sizing:border-box;padding:20px;display:flex;flex-direction:column;gap:14px"><span style="display:flex;justify-content:space-between;align-items:flex-start"><span style="width:44px;height:44px;border-radius:12px;background:{{c.bg}}"></span><span style="font-size:13px;color:var(--mut)">{{c.n}} judul</span></span><span style="font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:500">{{c.t}}</span><span style="display:flex;gap:8px"><button type="button" style="padding:10px 18px;border:1px solid var(--bd2);border-radius:999px;background:transparent;color:var(--strong);font-size:14px;font-weight:600;min-height:44px;box-sizing:border-box;display:flex;align-items:center;padding:8px 14px;font-size:13px;min-height:40px">Edit</button><button type="button" style="padding:8px 14px;border:1px solid var(--errbd);border-radius:999px;background:transparent;font-size:13px;font-weight:600;color:var(--err);min-height:40px">Hapus</button></span></div></sc-for>
</section>
<section aria-labelledby="ak" style="flex:1 1 300px;min-width:0;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px"><h2 id="ak" style="margin:0;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:22px">Tambah kategori</h2>
<div style="display:flex;flex-direction:column;gap:6px"><label for="k1" style="font-size:14px;font-weight:600">Nama kategori</label><input id="k1" placeholder="Contoh: Filsafat" style="padding:12px 16px;border:1px solid var(--bd2);border-radius:12px;background:var(--paper);color:var(--ink);font-size:15px;min-height:48px;box-sizing:border-box;width:100%"></div>
<div style="display:flex;flex-direction:column;gap:6px"><label for="k2" style="font-size:14px;font-weight:600">Deskripsi singkat</label><textarea id="k2" rows="3" placeholder="Opsional" style="padding:12px 16px;border:1px solid var(--bd2);border-radius:12px;background:var(--paper);color:var(--ink);font-size:15px;min-height:48px;box-sizing:border-box;width:100%;resize:vertical"></textarea></div>
<button type="button" style="padding:10px 20px;border:0;border-radius:999px;background:var(--pri);color:var(--onpri);font-size:14px;font-weight:600;min-height:44px;box-sizing:border-box;display:flex;align-items:center;justify-content:center">Simpan kategori</button></section></div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":900}}'>
class Component extends DCLogic {
constructor(props){ super(props); this.state = Object.assign({ theme:'dark' }, {}); }
renderVals() {
const th = this.state.theme, dk = th==='dark', S = this.state;
const chip = (p) => `padding:4px 12px;border-radius:99px;font-size:12px;font-weight:600;background:${p[0]};color:${p[1]};white-space:nowrap;`;
const ok = dk ? ['#12382F','#6EE0C3'] : ['#DDF0E4','#07522C'];
const wr = dk ? ['#3D2A12','#F2B24C'] : ['#FBEBC8','#5C3A05'];
const er = dk ? ['#3D1A17','#FF9C92'] : ['#F6DAD6','#7A1F18'];
const nt = dk ? ['#16305A','#D8E1F0'] : ['#DDEBE8','#10264A'];
const pal = [['#183E70','#FBF8F2'],['#B7791F','#1B1206'],['#243B5A','#FBF8F2'],['#7A2E2B','#FBF8F2'],['#DCE5F3','#0B1733']];
const cv = (i,w,h,extra) => `background:${pal[i%5][0]};color:${pal[i%5][1]};border-radius:4px 8px 8px 4px;box-shadow:inset 4px 0 0 rgba(0,0,0,.16);width:${w};height:${h};flex:none;box-sizing:border-box;${extra||''}`;
const MENU = [['h','Utama'],['l','Dashboard','AdminDashboard.dc.html'],['h','Katalog'],['l','Manajemen Buku','AdminBuku.dc.html'],['l','Manajemen Kategori','AdminKategori.dc.html'],['h','Sirkulasi'],['l','Peminjaman','AdminPeminjaman.dc.html'],['l','Pengembalian','AdminPeminjaman.dc.html'],['l','Denda','AdminPeminjaman.dc.html'],['h','Komunitas'],['l','Manajemen Anggota','AdminAnggota.dc.html'],['h','Sistem'],['l','Laporan dan Statistik','AdminLaporan.dc.html'],['l','Pengaturan Website','AdminPengaturan.dc.html']];
const menu = MENU.map(m => m[0]==='h' ? { isHead:true, isLink:false, label:m[1], href:'' } : { isHead:false, isLink:true, label:m[1], href:m[2], badge:m[4]||'', style:`display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:10px;min-height:44px;box-sizing:border-box;font-size:14px;color:#EAF2F0;background:${m[1]==='Manajemen Kategori'?'rgba(255,255,255,.14)':'transparent'};font-weight:${m[1]==='Manajemen Kategori'?600:400}` });
return Object.assign({ theme: th, toggleTheme: () => this.setState({ theme: dk?'light':'dark' }), themeLabel: dk?'Mode terang':'Mode gelap', menu }, (() => { const C=[['Sejarah','1.240','#E8DCC4'],['Sastra','2.105','#DCE5F3'],['Teknologi','980','#E9E2F1'],['Sains','1.410','#F3DDC9'],['Ekonomi','760','#DDE7F1'],['Bahasa','655','#F1E3E3']];
return { cats:C.map(c=>({t:c[0],n:c[1],bg:c[2]})) }; })());
}
}
</script>
</body>
</html>
