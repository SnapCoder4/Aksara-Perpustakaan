<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Aksara: Masuk dan Daftar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>.t{--page:#F6F2E9;--paper:#F6F2E9;--card:#FFFFFF;--soft:#E6ECF5;--bd:#E2DDD0;--bd2:#C3CBDB;--ink:#0B1733;--ink2:#1E2B4A;--mut:#4A5873;--strong:#10264A;--pri:#10264A;--onpri:#FBF8F2;--link:#183E70;--gold:#8A5A0B;--ok:#0A6B3B;--warn:#8A3B12;--err:#8F2A22;--errtx:#5A3A37;--dz:#EEF2F9;--dzi:#DCE5F3;--dzb:#9FB2D0;--errbg:#FCF1EF;--erri:#F6DAD6;--errbd:#D69A93;}.t[data-theme=dark]{--page:#0B1733;--paper:#0B1733;--card:#10264A;--soft:#16305A;--bd:#1E3760;--bd2:#3A5686;--ink:#F4F1EA;--ink2:#DCE4F2;--mut:#A9B7D0;--strong:#F4F1EA;--pri:#D9B66F;--onpri:#0B1733;--link:#F2D49A;--gold:#E0B35A;--ok:#6EE0A8;--warn:#F2A06B;--err:#FF9C92;--errtx:#E8C4C0;--dz:#0F2147;--dzi:#1B3A6B;--dzb:#3A5686;--errbg:#2A1513;--erri:#4A2420;--errbd:#7A3A34;}
body{margin:0;font-family:Inter,system-ui,sans-serif}
a{color:var(--link);text-decoration:none}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--link);outline-offset:2px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
.f{animation:fade .35s ease both}
.lamp{animation:glow 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.f,.lamp{animation:none}}
</style>
</helmet>
<div class="t" data-theme="{{theme}}" style="position:relative;overflow:hidden;width:100%;display:flex;flex-wrap:wrap;min-height:960px;background:var(--page);color:var(--ink)">

<!-- Panel visual -->
<section style="position:relative;flex:1 1 560px;min-width:0;min-height:560px;box-sizing:border-box;background:linear-gradient(160deg,#0E1D3F 0%,#2A2118 100%);color:#FBF8F2;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding:48px 72px 48px 56px">
<div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;padding:24px 0 0;opacity:.9">
<sc-for list="{{shelves}}" as="row" hint-placeholder-count="5">
<div style="display:flex;align-items:flex-end;gap:2px;height:150px;padding:0 12px;border-bottom:6px solid #3B2A1B;box-sizing:border-box">
<sc-for list="{{row.books}}" as="b" hint-placeholder-count="20"><span style="{{b.style}}"></span></sc-for>
</div>
</sc-for>
</div>
<div aria-hidden="true" class="lamp" style="position:absolute;left:-10%;top:42%;width:80%;height:60%;background:radial-gradient(ellipse at 40% 50%,rgba(224,179,90,.45),rgba(224,179,90,0) 65%)"></div>
<div aria-hidden="true" style="position:absolute;left:0;top:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(8,20,19,.55) 0%,rgba(8,20,19,.35) 40%,rgba(8,20,19,.88) 100%)"></div>

<a href="Main.dc.html" style="position:relative;display:flex;align-items:center;gap:12px;color:#FBF8F2">
<span style="width:44px;height:44px;border-radius:12px;background:#FBF8F2;color:#10264A;display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-size:26px">A</span>
<span style="display:flex;flex-direction:column;line-height:1.15"><span style="font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600">Aksara</span><span style="font-size:13px;color:#D8E1F0">Perpustakaan digital nasional</span></span>
</a>

<div style="position:relative;display:flex;flex-direction:column;gap:22px;max-width:520px">
<h1 style="margin:0;font-family:Fraunces,Georgia,serif;font-weight:500;font-size:60px;line-height:1.02;letter-spacing:-.02em">Gerbang menuju<br><em style="color:#E8C27A;font-weight:500">jendela ilmu</em></h1>
<p style="margin:0;font-size:18px;line-height:1.6;color:#EAF2F0">Telusuri koleksi, kelola peminjaman, dan lanjutkan bacaanmu dari satu akun.</p>
<div style="display:flex;gap:8px;align-items:center" aria-hidden="true"><span style="width:36px;height:8px;border-radius:99px;background:#FBF8F2"></span><span style="width:8px;height:8px;border-radius:99px;background:rgba(251,248,242,.5)"></span></div>
</div>

<div style="position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px">
<sc-for list="{{perks}}" as="p" hint-placeholder-count="3"><div style="display:flex;flex-direction:column;gap:4px"><span style="font-weight:600;font-size:15px">{{p.t}}</span><span style="font-size:13px;line-height:1.5;color:#D8E1F0">{{p.d}}</span></div></sc-for>
</div>
</section>

<!-- Panel form -->
<main style="position:relative;flex:1 1 520px;min-width:0;margin-left:-48px;border-radius:48px 0 0 48px;background:var(--page);display:flex;align-items:center;justify-content:center;padding:48px 40px;box-sizing:border-box">
<div style="position:relative;width:100%;max-width:480px;background:var(--card);border:1px solid var(--bd);border-radius:32px;padding:44px 40px 36px;box-sizing:border-box;box-shadow:0 40px 80px -40px rgba(10,53,52,.35);display:flex;flex-direction:column;gap:22px">

<div role="group" aria-label="Tema tampilan" style="position:absolute;right:20px;top:20px;display:flex;background:var(--bd);border-radius:999px;padding:3px">
<button type="button" onClick="{{setLight}}" aria-label="Mode terang" aria-pressed="{{isLight}}" style="{{sunBtn}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
<button type="button" onClick="{{setDark}}" aria-label="Mode gelap" aria-pressed="{{isDark}}" style="{{moonBtn}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg></button>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:8px">
<span style="width:52px;height:52px;border-radius:14px;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center;font-family:Fraunces,Georgia,serif;font-size:30px">A</span>
<h2 style="margin:0;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:34px;letter-spacing:-.01em;color:var(--strong)">{{title}}</h2>
<span style="font-size:15px;color:var(--mut)">{{sub}}</span>
</div>

<form class="f" style="display:flex;flex-direction:column;gap:16px">
<sc-if value="{{isReg}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:6px"><label for="nm" style="font-size:14px;font-weight:600">Nama lengkap</label><input id="nm" placeholder="Nama sesuai identitas" style="padding:14px 16px;border:1px solid var(--bd2);border-radius:14px;font-size:16px;background:var(--paper);color:var(--ink);min-height:52px;box-sizing:border-box"></div>
</sc-if>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="em" style="font-size:14px;font-weight:600">{{idLabel}}</label>
<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--bd2);border-radius:14px;background:var(--paper);padding:0 16px;min-height:52px;box-sizing:border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--mut)" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
<input id="em" placeholder="{{idPh}}" style="flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px;padding:14px 0">
</div>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<label for="pw" style="font-size:14px;font-weight:600">Kata sandi</label>
<div style="display:flex;align-items:center;gap:10px;border:1px solid var(--bd2);border-radius:14px;background:var(--paper);padding:0 6px 0 16px;min-height:52px;box-sizing:border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--mut)" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
<input id="pw" type="{{pwType}}" placeholder="Masukkan kata sandi" style="flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:16px;padding:14px 0">
<button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" aria-pressed="{{showPw}}" style="width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--mut);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><sc-if value="{{hidePw}}" hint-placeholder-val="{{ true }}"><path d="M4 4l16 16"/></sc-if></svg></button>
</div>
</div>
<sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}"><a href="Login.dc.html" style="align-self:flex-end;font-size:14px;font-weight:600;min-height:32px;display:flex;align-items:center">Lupa kata sandi?</a></sc-if>
<sc-if value="{{isReg}}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:var(--mut)">Minimal [JUMLAH] karakter.</span></sc-if>
<button type="button" style="padding:15px 20px;border:0;border-radius:999px;background:var(--pri);color:var(--onpri);font-size:16px;font-weight:600;min-height:54px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 14px 24px -14px rgba(10,53,52,.7)">{{cta}}<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>

<div style="display:flex;align-items:center;gap:14px;font-size:14px;color:var(--mut)"><span style="flex:1;height:1px;background:var(--bd)"></span>atau {{orWith}}<span style="flex:1;height:1px;background:var(--bd)"></span></div>

<button type="button" style="padding:14px 20px;border:1px solid var(--bd2);border-radius:999px;background:var(--card);color:var(--ink);font-size:16px;font-weight:600;min-height:54px;display:flex;align-items:center;justify-content:center;gap:12px">
<span aria-hidden="true" style="width:24px;height:24px;border-radius:99px;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--mut)">G</span>Lanjutkan dengan Google</button>

<span style="font-size:15px;color:var(--mut);text-align:center">{{switchQ}} <button type="button" onClick="{{switchMode}}" style="border:0;background:none;padding:0;font-size:15px;font-weight:700;color:var(--link);min-height:32px">{{switchA}}</button></span>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":960}}'>
class Component extends DCLogic {
constructor(props){ super(props); this.state = { theme:'dark', mode:'login', pw:false }; }
renderVals() {
const th = this.state.theme, m = this.state.mode, show = this.state.pw, dk = th==='dark';
const seg = (on) => `width:40px;height:36px;border:0;border-radius:99px;display:flex;align-items:center;justify-content:center;background:${on?'var(--card)':'transparent'};color:${on?'var(--strong)':'var(--mut)'};`;
const cols = ['#5A3B22','#7A4A2A','#2F4B45','#1F3A5C','#6B2F2A','#8A6A3A','#3E3A2C','#4F6B58','#3B2A1B','#A07840'];
let seed = 7; const rnd = () => (seed = (seed*9301+49297) % 233280) / 233280;
const shelves = [0,1,2,3,4].map(() => ({ books: Array.from({length:30}, () => { const w = 12 + Math.floor(rnd()*14), h = 62 + Math.floor(rnd()*80), c = cols[Math.floor(rnd()*cols.length)]; return { style:`width:${w}px;height:${Math.min(h,146)}px;background:${c};border-radius:2px 2px 0 0;flex:none;box-shadow:inset -2px 0 0 rgba(0,0,0,.25)` }; }) }));
const reg = m==='reg';
return {
theme: th, isLight: !dk, isDark: dk, setLight: () => this.setState({ theme:'dark' }), setDark: () => this.setState({ theme:'dark' }), sunBtn: seg(!dk), moonBtn: seg(dk),
isLogin: !reg, isReg: reg, switchMode: () => this.setState({ mode: reg?'login':'reg' }),
title: reg ? 'Buat akun anggota' : 'Masuk ke akun', sub: reg ? 'Gratis dan hanya butuh satu menit.' : 'Lanjutkan akses ke perpustakaan digital.',
idLabel: reg ? 'Email' : 'Email atau nomor anggota', idPh: reg ? 'Masukkan email' : 'Masukkan email atau nomor anggota',
cta: reg ? 'Daftar' : 'Masuk', orWith: reg ? 'daftar dengan' : 'masuk dengan', switchQ: reg ? 'Sudah punya akun?' : 'Belum punya akun?', switchA: reg ? 'Masuk' : 'Daftar sekarang',
showPw: show, hidePw: !show, pwType: show ? 'text' : 'password', pwLabel: show ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi', togglePw: () => this.setState({ pw: !show }),
shelves,
perks: [{t:'Koleksi lengkap',d:'Beragam buku dari berbagai bidang.'},{t:'Akses mudah',d:'Pinjam dan kelola buku secara digital.'},{t:'Untuk semua',d:'Pelajar, mahasiswa, hingga masyarakat umum.'}]
};
}
}
</script>
</body>
</html>
