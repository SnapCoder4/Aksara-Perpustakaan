{# Field form dengan label, pesan galat, dan petunjuk. #}
{% macro field(name, label, form, errors, type="text", required=false, max=150, ac="off", hint="", cls="", ph="") -%}
<div class="field {{ cls }}{{ ' has-error' if errors.get(name) }}">
  <label for="f-{{ name }}">{{ label }}{% if required %} <span class="muted" aria-hidden="true">*</span>{% endif %}</label>
  <input class="input" id="f-{{ name }}" name="{{ name }}" type="{{ type }}" value="{{ form.get(name, '') if type != 'password' else '' }}"
         maxlength="{{ max }}" autocomplete="{{ ac }}" placeholder="{{ ph }}" {{ "required" if required }} aria-invalid="{{ 'true' if errors.get(name) else 'false' }}"
         {% if errors.get(name) %}aria-describedby="e-{{ name }}"{% endif %}>
  {% if errors.get(name) %}<span class="field-error" id="e-{{ name }}" role="alert">{{ errors[name] }}</span>{% elif hint %}<span class="hint">{{ hint }}</span>{% endif %}
</div>
{%- endmacro %}
