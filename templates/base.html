<!doctype html>
<html lang="id" data-theme="dark" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aksara{% endblock %} · Aksara</title>
  <meta name="description" content="{% block description %}Perpustakaan digital nasional: telusuri koleksi, pinjam buku, dan pantau semuanya dari satu akun.{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="/static/img/logo-aksara.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("aksara-theme")==="light"?"light":"dark")}catch(e){}</script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  {% block css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip" href="#main">Lewati ke konten</a>
  {% block shell %}
    {% include "partials/navbar.html" %}
    <main id="main">{% block content %}{% endblock %}</main>
    {% include "partials/footer.html" %}
  {% endblock %}
  {% include "partials/toast.html" %}
  {% include "partials/modal.html" %}
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/toast.js"></script>
  <script src="/static/js/ui.js"></script>
  {% block js %}{% endblock %}
</body>
</html>
